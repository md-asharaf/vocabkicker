<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VocabKick – Football Quiz Game</title>
<meta name="description" content="Kick the football to the correct vocabulary answer! A fun quiz game with goalkeeper AI, trajectory preview, and sound effects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;font-family:'Outfit',sans-serif}
  #gameContainer{
    position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,#1a2a1a 0%,#0a0f0a 100%);
  }
  #gameCanvas{display:block;touch-action:none;cursor:crosshair;}

  /* ── MENU ── */
  #menuScreen{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#0d1b0d 0%,#142814 40%,#0d1b0d 100%);
    z-index:100;
  }
  #menuScreen h1{
    font-size:clamp(2.2rem,6vw,4rem);font-weight:900;letter-spacing:2px;
    background:linear-gradient(135deg,#ffd700,#ff8c00,#ff4500);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    text-shadow:none;margin-bottom:.3rem;
    animation:titlePulse 2s ease-in-out infinite alternate;
  }
  @keyframes titlePulse{from{filter:drop-shadow(0 0 12px #ffd700aa)}to{filter:drop-shadow(0 0 30px #ff8c00cc)}}
  #menuScreen .subtitle{color:#8fbc8f;font-size:clamp(.9rem,2.5vw,1.2rem);margin-bottom:2.5rem;letter-spacing:1px}
  .menuBtn{
    padding:.9rem 3rem;font-size:clamp(1rem,3vw,1.3rem);font-weight:700;
    background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:none;
    border-radius:50px;cursor:pointer;letter-spacing:1px;
    box-shadow:0 0 30px #22c55e66,0 4px 20px #00000080;
    transition:all .2s;font-family:'Outfit',sans-serif;
  }
  .menuBtn:hover{transform:scale(1.07);box-shadow:0 0 50px #22c55e99,0 6px 30px #00000090}
  .menuBtn:active{transform:scale(.97)}
  .menuFeatures{margin-top:2rem;display:flex;gap:1.5rem;flex-wrap:wrap;justify-content:center}
  .featBadge{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    color:#aaa;padding:.4rem .9rem;border-radius:20px;font-size:.8rem;
  }
  .menuBall{font-size:3.5rem;margin-bottom:1rem;animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── HUD ── */
  #hud{
    position:absolute;top:0;left:0;right:0;
    display:none;align-items:center;justify-content:space-between;
    padding:.5rem 1rem;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(255,215,0,.2);z-index:50;gap:.5rem;flex-wrap:wrap;
  }
  .hudItem{display:flex;flex-direction:column;align-items:center;gap:2px}
  .hudLabel{font-size:.6rem;color:#888;letter-spacing:1px;text-transform:uppercase}
  .hudValue{font-size:clamp(1rem,3vw,1.4rem);font-weight:900;color:#ffd700}
  #streakValue{color:#ff6b35}
  #questionPills{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:center}
  .qPill{width:10px;height:10px;border-radius:50%;background:#333;transition:all .3s}
  .qPill.correct{background:#22c55e;box-shadow:0 0 6px #22c55e}
  .qPill.wrong{background:#ef4444;box-shadow:0 0 6px #ef4444}
  .qPill.current{background:#ffd700;box-shadow:0 0 8px #ffd700;transform:scale(1.3)}

  /* ── QUESTION CARD ── */
  #questionCard{
    position:absolute;bottom:0;left:0;right:0;
    background:rgba(0,0,0,.85);backdrop-filter:blur(12px);
    border-top:1px solid rgba(255,215,0,.25);
    padding:.7rem 1rem;z-index:50;display:none;
  }
  #definitionText{
    color:#f0f0f0;font-size:clamp(.8rem,2.5vw,1rem);font-weight:600;
    text-align:center;line-height:1.4;
  }
  #hintRow{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:.3rem}
  #hintBtn{
    background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.4);
    color:#ffd700;padding:.2rem .7rem;border-radius:20px;font-size:.72rem;
    cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s;
  }
  #hintBtn:hover{background:rgba(255,215,0,.3)}
  #hintText{color:#ffd700;font-size:.75rem;font-style:italic;display:none}
  #aimInstructions{color:#aaa;font-size:.72rem;text-align:center;margin-top:.2rem}

  /* ── FEEDBACK OVERLAY ── */
  #feedbackOverlay{
    position:absolute;inset:0;pointer-events:none;z-index:80;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  #feedbackBanner{
    background:rgba(0,0,0,.85);border-radius:20px;padding:1.2rem 2.5rem;
    text-align:center;backdrop-filter:blur(10px);
    transform:scale(0) translateY(-30px);opacity:0;
    transition:all .4s cubic-bezier(.34,1.56,.64,1);
    border:2px solid transparent;pointer-events:none;max-width:90vw;
  }
  #feedbackBanner.show{transform:scale(1) translateY(0);opacity:1}
  #feedbackBanner.correct{border-color:#22c55e;box-shadow:0 0 40px #22c55e66}
  #feedbackBanner.wrong{border-color:#ef4444;box-shadow:0 0 40px #ef444466}
  #feedbackEmoji{font-size:3rem;display:block;margin-bottom:.3rem}
  #feedbackTitle{font-size:1.5rem;font-weight:900;margin-bottom:.2rem}
  #feedbackPoints{font-size:1.1rem;font-weight:700;margin-bottom:.4rem}
  #feedbackWord{font-size:.9rem;color:#ccc}
  #particleCanvas{position:absolute;inset:0;pointer-events:none;z-index:79}

  /* ── GAME OVER ── */
  #gameOverScreen{
    position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;
    background:rgba(0,0,0,.92);backdrop-filter:blur(15px);z-index:200;
    animation:fadeIn .5s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  #gameOverScreen h2{
    font-size:clamp(2rem,5vw,3rem);font-weight:900;
    background:linear-gradient(135deg,#ffd700,#ff8c00);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    margin-bottom:.5rem;
  }
  .goStat{
    color:#ccc;font-size:clamp(.9rem,2.5vw,1.1rem);margin:.2rem 0;
    display:flex;align-items:center;gap:.5rem;
  }
  .goStat span{color:#ffd700;font-weight:700;font-size:1.2em}
  #goScoreBig{
    font-size:clamp(3rem,10vw,6rem);font-weight:900;color:#ffd700;
    text-shadow:0 0 40px #ffd700aa;margin:.5rem 0;
  }
  .goButtons{display:flex;gap:1rem;margin-top:1.5rem;flex-wrap:wrap;justify-content:center}
  .goBtn{
    padding:.8rem 2.2rem;font-size:1rem;font-weight:700;border:none;
    border-radius:50px;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s;
  }
  .goBtn.primary{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;
    box-shadow:0 0 20px #22c55e66}
  .goBtn.secondary{background:rgba(255,255,255,.1);color:#ccc;border:1px solid rgba(255,255,255,.2)}
  .goBtn:hover{transform:scale(1.05)}
  .starsRow{font-size:2rem;margin:.5rem 0}
  #resultList{
    max-height:160px;overflow-y:auto;width:min(400px,85vw);margin:.8rem 0;
    scrollbar-width:thin;scrollbar-color:#333 transparent;
  }
  .rItem{
    display:flex;justify-content:space-between;align-items:center;
    padding:.3rem .5rem;border-bottom:1px solid rgba(255,255,255,.05);
    font-size:.78rem;color:#aaa;
  }
  .rItem .rWord{color:#f0f0f0;font-weight:600;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rItem .rDef{max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.7rem}
  .rItem .rMark{font-size:1rem}

  /* ── LOADING ── */
  #loadingScreen{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#0d1b0d;z-index:300;
  }
  #loadingScreen .spinner{
    width:60px;height:60px;border:4px solid rgba(255,215,0,.2);
    border-top-color:#ffd700;border-radius:50%;animation:spin .8s linear infinite;
    margin-bottom:1rem;
  }
  #loadingScreen p{color:#888;font-size:.9rem}
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <canvas id="particleCanvas"></canvas>

  <!-- Loading -->
  <div id="loadingScreen">
    <div class="spinner"></div>
    <p>Loading VocabKick…</p>
  </div>

  <!-- Menu -->
  <div id="menuScreen" style="display:none">
    <div class="menuBall">&#x26BD;</div>
    <h1>VOCABKICK</h1>
    <p class="subtitle">Kick to the right answer!</p>
    <button class="menuBtn" id="startBtn">&#x26BD; KICK OFF</button>
    <div class="menuFeatures">
      <span class="featBadge">&#x1F9E0; 10 Questions</span>
      <span class="featBadge">&#x1F945; 4 Goalkeepers</span>
      <span class="featBadge">&#x1F4AF; 100pts per Goal</span>
      <span class="featBadge">&#x1F3B5; Sound Effects</span>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hudItem">
      <span class="hudLabel">Score</span>
      <span class="hudValue" id="scoreValue">0</span>
    </div>
    <div class="hudItem">
      <div id="questionPills"></div>
      <span class="hudLabel" id="qNumLabel">Q 1 / 10</span>
    </div>
    <div class="hudItem">
      <span class="hudLabel">&#x1F525; Streak</span>
      <span class="hudValue" id="streakValue">0</span>
    </div>
  </div>

  <!-- Question Card -->
  <div id="questionCard">
    <div id="definitionText">Loading...</div>
    <div id="hintRow">
      <button id="hintBtn">&#x1F4A1; Hint</button>
      <span id="hintText"></span>
    </div>
    <div id="aimInstructions">&#x1F5B1; Drag from ball to aim &rarr; Release to kick</div>
  </div>

  <!-- Feedback -->
  <div id="feedbackOverlay">
    <div id="feedbackBanner">
      <span id="feedbackEmoji"></span>
      <div id="feedbackTitle"></div>
      <div id="feedbackPoints"></div>
      <div id="feedbackWord"></div>
    </div>
  </div>

  <!-- Game Over -->
  <div id="gameOverScreen">
    <div class="starsRow" id="starsRow">&#x2B50;&#x2B50;&#x2B50;</div>
    <h2>FULL TIME!</h2>
    <div id="goScoreBig">0</div>
    <div class="goStat">Goals Scored: <span id="goCorrect">0</span> / 10</div>
    <div class="goStat">Best Streak: <span id="goStreak">0</span> &#x1F525;</div>
    <div class="goStat">Accuracy: <span id="goAccuracy">0%</span></div>
    <div id="resultList"></div>
    <div class="goButtons">
      <button class="goBtn primary" id="playAgainBtn">&#x26BD; Play Again</button>
      <button class="goBtn secondary" id="menuBtn2">&#x1F3E0; Menu</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

// ─── CANVAS SETUP ──────────────────────────────────────────────────
const canvas  = document.getElementById('gameCanvas');
const ctx     = canvas.getContext('2d');
const pCanvas = document.getElementById('particleCanvas');
const pCtx    = pCanvas.getContext('2d');

let W, H, SCALE;

// ─── DOM REFS ──────────────────────────────────────────────────────
const loadingScreen  = document.getElementById('loadingScreen');
const menuScreen     = document.getElementById('menuScreen');
const hud            = document.getElementById('hud');
const questionCard   = document.getElementById('questionCard');
const feedbackBanner = document.getElementById('feedbackBanner');
const gameOverScreen = document.getElementById('gameOverScreen');

// ─── GAME STATE ────────────────────────────────────────────────────
const ST = { IDLE:'idle', AIMING:'aiming', RUNNING:'running', FLYING:'flying', RESULT:'result' };
let state = ST.IDLE;

// ─── DATA ──────────────────────────────────────────────────────────
let vocabData = [];
let questions = [];
let currentQ  = 0;
let score     = 0;
let streak    = 0;
let maxStreak = 0;
let results   = [];

// ─── PHYSICS OBJECTS ───────────────────────────────────────────────
let ball = { x:0, y:0, r:13, spin:0 };
let ballT = 0;
let ballInFlight = false;
let ballLanded   = false;
let flightFrame  = 0;
const FLIGHT_DUR = 85;

let ballPath = { sx:0,sy:0, cx:0,cy:0, tx:0,ty:0 };

let aimStart = null;
let aimEnd   = null;

let kicker = { x:0, y:0, stepPhase:0, isRunning:false, isKicking:false, kickPhase:0, done:false };
let runStepTimer = 0;
let runStepCount = 0;
const MAX_STEPS  = 4;

let goalkeepers = [];
let particles   = [];
let screenShake = { x:0, y:0, timer:0, mag:0 };
let goalFlash   = 0;
let idleTime    = 0;

// ─── AUDIO ─────────────────────────────────────────────────────────
let audioCtx = null;
function ac(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); return audioCtx; }

function noise(dur, vol=1){
  const a=ac(), buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
  const src=a.createBufferSource(); src.buffer=buf;
  const g=a.createGain(); g.gain.setValueAtTime(vol,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
  src.connect(g); g.connect(a.destination); src.start(); return src;
}
function osc(type,freq,dur,vol=0.3,freqEnd=null){
  const a=ac(), o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,a.currentTime);
  if(freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd,a.currentTime+dur);
  g.gain.setValueAtTime(vol,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur); return o;
}

function playKick(){
  // Thud + hiss
  const a=ac();
  const buf=a.createBuffer(1,Math.floor(a.sampleRate*.15),a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.2);
  const src=a.createBufferSource(); src.buffer=buf;
  const filt=a.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=600;
  const g=a.createGain(); g.gain.setValueAtTime(1,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+.15);
  src.connect(filt); filt.connect(g); g.connect(a.destination); src.start();
}

function playGoal(){
  // Crowd cheer: ascending tones
  [0,80,180,300,450].forEach((delay,i)=>{
    setTimeout(()=>osc('sine',500+i*150,.5,.25,900+i*100),delay);
  });
  // White noise crowd
  const a=ac(), buf=a.createBuffer(1,Math.floor(a.sampleRate*1.2),a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*.12;
  const src=a.createBufferSource(); src.buffer=buf;
  const filt=a.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=900;
  const g=a.createGain(); g.gain.setValueAtTime(.5,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+1.2);
  src.connect(filt); filt.connect(g); g.connect(a.destination); src.start();
}

function playMiss(){
  osc('sawtooth',300,.45,.35,70);
  setTimeout(()=>noise(.12,.5),350); // catch thud
}

function playWhistle(){
  const a=ac(), o=a.createOscillator(), g=a.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(2400,a.currentTime);
  o.frequency.setValueAtTime(2000,a.currentTime+.12);
  o.frequency.setValueAtTime(2400,a.currentTime+.28);
  g.gain.setValueAtTime(.28,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+.42);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+.44);
}

function playFootstep(){
  const a=ac(), buf=a.createBuffer(1,Math.floor(a.sampleRate*.04),a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)*.35;
  const src=a.createBufferSource(); src.buffer=buf;
  const g=a.createGain(); g.gain.setValueAtTime(.45,a.currentTime);
  src.connect(g); g.connect(a.destination); src.start();
}

// ─── RESIZE ────────────────────────────────────────────────────────
function resize(){
  const cont = document.getElementById('gameContainer');
  W = cont.clientWidth; H = cont.clientHeight;
  canvas.width  = W; canvas.height  = H;
  pCanvas.width = W; pCanvas.height = H;
  SCALE = Math.min(W/900, H/600);
  resetPositions();
}
window.addEventListener('resize', ()=>{ resize(); });

function resetPositions(){
  kicker.x = W/2; kicker.y = H*0.82;
  ball.x = W/2;   ball.y = H*0.78; ball.r = 13*SCALE;
}

// ─── CANVAS ROUNDRECT POLYFILL ─────────────────────────────────────
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='object' && r!==null){
      const ul=r.upperLeft||0,ur=r.upperRight||0,lr=r.lowerRight||0,ll=r.lowerLeft||0;
      this.beginPath();
      this.moveTo(x+ul,y); this.lineTo(x+w-ur,y); this.quadraticCurveTo(x+w,y,x+w,y+ur);
      this.lineTo(x+w,y+h-lr); this.quadraticCurveTo(x+w,y+h,x+w-lr,y+h);
      this.lineTo(x+ll,y+h); this.quadraticCurveTo(x,y+h,x,y+h-ll);
      this.lineTo(x,y+ul); this.quadraticCurveTo(x,y,x+ul,y); this.closePath();
    } else {
      r=r||0;
      this.beginPath();
      this.moveTo(x+r,y); this.lineTo(x+w-r,y); this.quadraticCurveTo(x+w,y,x+w,y+r);
      this.lineTo(x+w,y+h-r); this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
      this.lineTo(x+r,y+h); this.quadraticCurveTo(x,y+h,x,y+h-r);
      this.lineTo(x,y+r); this.quadraticCurveTo(x,y,x+r,y); this.closePath();
    }
    return this;
  };
}

// ─── DATA LOAD ─────────────────────────────────────────────────────
async function loadData(){
  try{
    const r = await fetch('./data.json');
    vocabData = await r.json();
    init();
  } catch(e){
    loadingScreen.innerHTML='<p style="color:#f88;font-family:Outfit,sans-serif">Failed to load data.json – please serve from a local server.</p>';
  }
}

function init(){
  resize();
  loadingScreen.style.display='none';
  menuScreen.style.display='flex';

  document.getElementById('startBtn').addEventListener('click',   startGame);
  document.getElementById('playAgainBtn').addEventListener('click', startGame);
  document.getElementById('menuBtn2').addEventListener('click',   showMenu);
  document.getElementById('hintBtn').addEventListener('click',    showHint);
  setupInput();
}

// ─── QUESTION GEN ──────────────────────────────────────────────────
function buildQuestions(){
  const shuffled = [...vocabData].sort(()=>Math.random()-.5);
  questions = shuffled.slice(0,10).map(entry=>{
    const pool  = vocabData.filter(v=>v.word!==entry.word);
    const wrong = pool.sort(()=>Math.random()-.5).slice(0,3).map(v=>v.word);
    const opts  = [...wrong, entry.word].sort(()=>Math.random()-.5);
    return { definition:entry.definition, answer:entry.word, mnemonic:entry.mnemonic, options:opts };
  });
}

// ─── GAME FLOW ─────────────────────────────────────────────────────
function startGame(){
  menuScreen.style.display='none';
  gameOverScreen.style.display='none';
  hud.style.display='flex';
  questionCard.style.display='block';
  score=0; streak=0; maxStreak=0; currentQ=0; results=[];
  buildQuestions();
  buildQPills();
  updateHUD();
  loadQuestion();
  requestAnimationFrame(gameLoop);
}

function showMenu(){
  gameOverScreen.style.display='none';
  menuScreen.style.display='flex';
  hud.style.display='none';
  questionCard.style.display='none';
}

function buildQPills(){
  const el=document.getElementById('questionPills'); el.innerHTML='';
  for(let i=0;i<10;i++){
    const p=document.createElement('div'); p.className='qPill'; p.id='pill'+i; el.appendChild(p);
  }
  document.getElementById('pill0').classList.add('current');
}

function updateHUD(){
  document.getElementById('scoreValue').textContent  = score;
  document.getElementById('streakValue').textContent = streak;
  document.getElementById('qNumLabel').textContent   = 'Q '+(currentQ+1)+' / 10';
}

function loadQuestion(){
  state = ST.IDLE;
  const q = questions[currentQ];
  document.getElementById('definitionText').textContent = q.definition;
  document.getElementById('hintText').style.display='none';
  document.getElementById('hintText').textContent = 'Hint: '+q.mnemonic;
  resetPositions();
  setupGoalkeepers(q.options, q.answer);
  ballInFlight=false; ballLanded=false; ballT=0; flightFrame=0;
  kicker.isRunning=false; kicker.isKicking=false; kicker.done=false;
  kicker.kickPhase=0; kicker.stepPhase=0;
  runStepTimer=0; runStepCount=0;
  aimStart=null; aimEnd=null;
  particles=[];
  feedbackBanner.className='';
  feedbackBanner.style.transform='scale(0) translateY(-30px)';
  feedbackBanner.style.opacity='0';
  idleTime=0;
  setTimeout(()=>{ if(state===ST.IDLE) playWhistle(); }, 300);
}

function showHint(){
  const h=document.getElementById('hintText');
  h.style.display = h.style.display==='none'?'inline':'none';
}

// ─── GOALKEEPERS ───────────────────────────────────────────────────
function setupGoalkeepers(options, answer){
  const goalW   = W*0.58, goalLeft = (W-W*0.58)/2;
  const goalTop = H*0.08, goalH    = H*0.28;
  goalkeepers = options.map((opt,i)=>({
    x: goalLeft + goalW*(i+.5)/4,
    y: goalTop  + goalH*0.55,
    label: ['A','B','C','D'][i],
    option: opt,
    isCorrect: opt===answer,
    diveDir:   0,
    divePhase: 0,
    caught:    false,
    reacted:   false
  }));
}

// ─── INPUT ─────────────────────────────────────────────────────────
function setupInput(){
  canvas.addEventListener('mousedown', e=>onDown(getPos(e)));
  canvas.addEventListener('mousemove', e=>onMove(getPos(e)));
  canvas.addEventListener('mouseup',   e=>onUp(getPos(e)));
  canvas.addEventListener('touchstart',e=>{e.preventDefault();onDown(getPos(e.touches[0]));},{passive:false});
  canvas.addEventListener('touchmove', e=>{e.preventDefault();onMove(getPos(e.touches[0]));},{passive:false});
  canvas.addEventListener('touchend',  e=>{e.preventDefault();onUp(getPos(e.changedTouches[0]));},{passive:false});
}
function getPos(e){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function onDown(pos){
  if(state!==ST.IDLE) return;
  const d=Math.hypot(pos.x-ball.x, pos.y-ball.y);
  if(d<55*SCALE){ aimStart={...pos}; aimEnd={...pos}; state=ST.AIMING; }
}
function onMove(pos){
  if(state!==ST.AIMING) return;
  aimEnd={x:pos.x, y:Math.min(pos.y, ball.y+8)};
}
function onUp(pos){
  if(state!==ST.AIMING) return;
  aimEnd={x:pos.x, y:Math.min(pos.y, ball.y+8)};
  const dx=aimStart.x-aimEnd.x, dy=aimStart.y-aimEnd.y;
  const dist=Math.hypot(dx,dy);
  if(dist<12){ state=ST.IDLE; aimStart=null; aimEnd=null; return; }
  beginKick(dx,dy,dist);
}

// ─── KICK ──────────────────────────────────────────────────────────
function beginKick(dx,dy,dist){
  state = ST.RUNNING;
  const power = Math.min(dist/110, 1);
  const len=Math.hypot(dx,dy), ndx=dx/len, ndy=dy/len;
  ballPath.sx=ball.x; ballPath.sy=ball.y;
  ballPath.tx=ball.x+ndx*W*.62;
  ballPath.ty=Math.min(ball.y+ndy*H*.62, H*.24);
  ballPath.cx=(ball.x+ballPath.tx)/2 + (Math.random()-.5)*20*SCALE;
  ballPath.cy=Math.min(ball.y, ballPath.ty) - H*(0.15+power*.1) - 30*SCALE;
  kicker.isRunning=true; kicker.done=false;
}

// ─── GK REACT ──────────────────────────────────────────────────────
function reactGoalkeepers(){
  goalkeepers.forEach(gk=>{
    if(gk.isCorrect){ gk.reacted=true; return; }
    const d=Math.hypot(ballPath.tx-gk.x, ballPath.ty-gk.y);
    if(d < W*0.11){
      gk.diveDir = ballPath.tx < gk.x ? -1 : 1;
    } else {
      gk.diveDir = Math.random()<0.25 ? (Math.random()<.5?-1:1) : 0;
    }
    gk.reacted=true;
  });
}

// ─── FIND HIT GK ───────────────────────────────────────────────────
function findHitGK(){
  let best=null, minD=Infinity;
  goalkeepers.forEach(gk=>{ const d=Math.hypot(ballPath.tx-gk.x, ballPath.ty-gk.y); if(d<minD){minD=d;best=gk;} });
  return {gk:best, dist:minD};
}

// ─── FLIGHT ────────────────────────────────────────────────────────
function updateFlight(){
  flightFrame++;
  ballT = Math.min(flightFrame/FLIGHT_DUR, 1);
  const t=ballT, mt=1-t;
  ball.x = mt*mt*ballPath.sx + 2*mt*t*ballPath.cx + t*t*ballPath.tx;
  ball.y = mt*mt*ballPath.sy + 2*mt*t*ballPath.cy + t*t*ballPath.ty;
  ball.r = (13-5*t)*SCALE;
  ball.spin += 0.28;
  // GK dive
  goalkeepers.forEach(gk=>{
    if(gk.diveDir!==0 && t>0.28) gk.divePhase=Math.min((t-0.28)/0.55, 1);
  });
  if(ballT>=1){ ballLanded=true; ballInFlight=false; onBallLand(); }
}

function onBallLand(){
  const {gk, dist}=findHitGK();
  const hitR=W*0.13;
  if(!gk.isCorrect && dist<hitR){
    // Wrong GK caught
    gk.caught=true;
    score=Math.max(0,score-10);
    streak=0;
    results.push({word:questions[currentQ].answer, correct:false});
    showFeedback(false);
    playMiss();
    shakeScreen(9,420);
    spawnParticles(ball.x,ball.y,'miss');
  } else if(gk.isCorrect && dist<hitR*1.6){
    // GOAL!
    score+=100;
    streak++;
    maxStreak=Math.max(maxStreak,streak);
    results.push({word:questions[currentQ].answer, correct:true});
    showFeedback(true);
    playGoal();
    goalFlash=1;
    spawnParticles(ball.x,ball.y,'goal');
    shakeScreen(5,220);
  } else {
    // Missed net entirely
    score=Math.max(0,score-10);
    streak=0;
    results.push({word:questions[currentQ].answer, correct:false});
    showFeedback(false);
    playMiss();
    shakeScreen(6,300);
    spawnParticles(ball.x,ball.y,'miss');
  }
  updateHUD();
  const pill=document.getElementById('pill'+currentQ);
  if(pill){ pill.classList.remove('current'); pill.classList.add(results[results.length-1].correct?'correct':'wrong'); }
  state=ST.RESULT;
  setTimeout(advanceQuestion, 2500);
}

function advanceQuestion(){
  currentQ++;
  if(currentQ>=10){ endGame(); return; }
  const p=document.getElementById('pill'+currentQ);
  if(p) p.classList.add('current');
  updateHUD();
  loadQuestion();
}

// ─── FEEDBACK ──────────────────────────────────────────────────────
function showFeedback(correct){
  const q=questions[currentQ];
  const ecorr=['&#x26BD;&#x1F389;','&#x1F945;&#x2728;','&#x1F4AF;&#x1F525;','&#x1F3AF;&#x26A1;','&#x1F31F;&#x1F4A5;'];
  const ewrng=['&#x1F92C;&#x1F9E4;','&#x1F64A;&#x274C;','&#x1F4A8;&#x1F926;','&#x1F6D1;&#x1F630;','&#x1F621;&#x1F9E4;'];
  const tcorr=['GOOOAL!','PERFECT SHOT!','BULLSEYE!','AMAZING!','GREAT KICK!'];
  const twrng=['BLOCKED!','CAUGHT!','WRONG ANSWER!','SAVED!','MISSED!'];
  const idx=Math.floor(Math.random()*5);

  feedbackBanner.className='';
  document.getElementById('feedbackEmoji').innerHTML  = correct ? ecorr[idx] : ewrng[idx];
  const titleEl=document.getElementById('feedbackTitle');

  titleEl.style.color = correct ? '#22c55e' : '#ef4444';

// ─── SHAKE ─────────────────────────────────────────────────────────
function shakeScreen(mag,dur){ screenShake.mag=mag; screenShake.timer=dur; }

// ─── PARTICLES ─────────────────────────────────────────────────────
function spawnParticles(x,y,type){
  const count=type==='goal'?90:35;
  const colors=type==='goal'
    ?['#ffd700','#22c55e','#ff8c00','#ffffff','#00e5ff','#ff69b4']
    :['#ef4444','#ff6b35','#cc0000'];
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const spd=type==='goal'?2+Math.random()*7:1+Math.random()*4;
    particles.push({
      x,y,
      vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-(type==='goal'?2:0),
      life:1,decay:.012+Math.random()*.018,
      r:type==='goal'?3+Math.random()*6:2+Math.random()*4,
      color:colors[Math.floor(Math.random()*colors.length)],
      shape:type==='goal'&&Math.random()<.4?'star':'circle'
    });
  }
}

function updateParticles(){
  particles=particles.filter(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=p.decay; return p.life>0;
  });
}

function drawParticles(){
  pCtx.clearRect(0,0,W,H);
  particles.forEach(p=>{
    pCtx.save(); pCtx.globalAlpha=p.life; pCtx.fillStyle=p.color;
    if(p.shape==='star'){ drawStar(pCtx,p.x,p.y,p.r*.5,p.r,5); }
    else { pCtx.beginPath(); pCtx.arc(p.x,p.y,p.r,0,Math.PI*2); pCtx.fill(); }
    pCtx.restore();
  });
}

function drawStar(c,x,y,r1,r2,pts){
  c.beginPath();
  for(let i=0;i<pts*2;i++){
    const r=i%2?r1:r2, a=i*Math.PI/pts-Math.PI/2;
    i===0?c.moveTo(x+r*Math.cos(a),y+r*Math.sin(a)):c.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));
  }
  c.closePath(); c.fill();
}

// ─── GAME OVER ─────────────────────────────────────────────────────
function endGame(){
  state=ST.IDLE;
  hud.style.display='none';
  questionCard.style.display='none';
  feedbackBanner.classList.remove('show');
  gameOverScreen.style.display='flex';
  const correct=results.filter(r=>r.correct).length;
  document.getElementById('goScoreBig').textContent=score;
  document.getElementById('goCorrect').textContent=correct;
  document.getElementById('goStreak').textContent=maxStreak;
  document.getElementById('goAccuracy').textContent=Math.round(correct/10*100)+'%';
  document.getElementById('starsRow').textContent=correct>=8?'⭐⭐⭐':correct>=5?'⭐⭐':correct>=3?'⭐':'😔';
  const rl=document.getElementById('resultList'); rl.innerHTML='';
  questions.forEach((q,i)=>{
    const div=document.createElement('div'); div.className='rItem';
    div.innerHTML='<span class="rWord">'+q.answer+'</span><span class="rDef">'+q.definition.substring(0,30)+'</span><span class="rMark">'+(results[i]&&results[i].correct?'✅':'❌')+'</span>';
    rl.appendChild(div);
  });
  playWhistle();
  setTimeout(()=>{ if(correct>=5) playGoal(); },600);
}

// ─── DRAWING ───────────────────────────────────────────────────────

function drawPitch(){
  // Sky strip
  const sky=ctx.createLinearGradient(0,0,0,H*.14);
  sky.addColorStop(0,'#1a3322'); sky.addColorStop(1,'#265c36');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H*.14);

  // Main grass
  const grd=ctx.createLinearGradient(0,H*.14,0,H);
  grd.addColorStop(0,'#2d8a2d'); grd.addColorStop(.45,'#38a038'); grd.addColorStop(1,'#2a7a2a');
  ctx.fillStyle=grd; ctx.fillRect(0,H*.14,W,H*.86);

  // Alternating grass stripes
  ctx.save(); ctx.globalAlpha=.06;
  const stripes=12;
  for(let i=0;i<stripes;i++){
    if(i%2===0){ ctx.fillStyle='#000'; ctx.fillRect(0,H*.14+i*(H*.86/stripes),W,H*.86/stripes); }
  }
  ctx.restore();

  // Field lines
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=2*SCALE;
  // Outer boundary
  ctx.strokeRect(W*.08,H*.15,W*.84,H*.73);
  // Half way
  ctx.beginPath(); ctx.moveTo(W*.08,H*.515); ctx.lineTo(W*.92,H*.515); ctx.stroke();
  // Penalty boxes
  ctx.strokeStyle='rgba(255,255,255,0.32)'; ctx.lineWidth=1.8*SCALE;
  ctx.strokeRect(W*.21,H*.15,W*.58,H*.33); // big box
  ctx.strokeRect(W*.34,H*.15,W*.32,H*.13); // 6-yd box
  // Center circle
  ctx.beginPath(); ctx.arc(W*.5,H*.515,H*.1,0,Math.PI*2); ctx.stroke();
  // Center spot
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(W*.5,H*.515,3*SCALE,0,Math.PI*2); ctx.fill();
  // Penalty spot
  ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(W*.5,H*.35,3*SCALE,0,Math.PI*2); ctx.fill();
  // Penalty arc
  ctx.beginPath(); ctx.arc(W*.5,H*.35,H*.13,Math.PI*.1,Math.PI*.9); ctx.stroke();
  ctx.restore();
}

function drawGoal(){
  const gW=W*.58, gL=(W-W*.58)/2, gT=H*.05, gH=H*.28;
  const pw=6*SCALE;

  // Net fill
  const ng=ctx.createLinearGradient(gL,gT,gL+gW,gT+gH);
  ng.addColorStop(0,'rgba(0,0,0,.32)'); ng.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=ng; ctx.fillRect(gL,gT,gW,gH);

  // Net grid lines
  ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.13)'; ctx.lineWidth=.8*SCALE;
  const NX=22, NY=14;
  for(let i=0;i<=NX;i++){ const x=gL+i*(gW/NX); ctx.beginPath(); ctx.moveTo(x,gT); ctx.lineTo(x,gT+gH); ctx.stroke(); }
  for(let j=0;j<=NY;j++){ const y=gT+j*(gH/NY); ctx.beginPath(); ctx.moveTo(gL,y); ctx.lineTo(gL+gW,y); ctx.stroke(); }
  // Diagonal net feel
  ctx.globalAlpha=.05;
  for(let i=-NY;i<=NX;i++){ const x=gL+i*(gW/NX); ctx.beginPath(); ctx.moveTo(x,gT); ctx.lineTo(x+gH*.6,gT+gH); ctx.stroke(); }
  ctx.restore();

  // Goal posts & crossbar (white 3D)
  const drawPost=(x,y,w2,h2)=>{
    ctx.fillStyle='#999'; ctx.fillRect(x,y,w2,h2);
    ctx.fillStyle='#fff'; ctx.fillRect(x+1,y+1,w2-2,h2-2);
  };
  drawPost(gL-pw*.5, gT-pw*.5, pw, gH+pw); // left post
  drawPost(gL+gW-pw*.5, gT-pw*.5, pw, gH+pw); // right post
  drawPost(gL-pw*.5, gT-pw*.5, gW+pw, pw); // crossbar

  // Ground shadow
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.fillRect(gL,gT+gH,gW,4*SCALE);
}

function drawGoalkeepers(){
  goalkeepers.forEach((gk,i)=>{
    const diveX = gk.diveDir*gk.divePhase*60*SCALE;
    const diveA = gk.diveDir*gk.divePhase*.6;
    ctx.save();
    ctx.translate(gk.x+diveX, gk.y);
    ctx.rotate(diveA);

    const s=SCALE*.9;
    const JC=['#e74c3c','#3498db','#f39c12','#9b59b6'][i];

    // Shadow
    ctx.fillStyle='rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(0,30*s,18*s,6*s,0,0,Math.PI*2); ctx.fill();

    // Legs
    ctx.strokeStyle=JC; ctx.lineWidth=5*s; ctx.lineCap='round';
    if(gk.divePhase>0.1){
      ctx.beginPath(); ctx.moveTo(-4*s,10*s); ctx.lineTo(-16*s,26*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(4*s,10*s);  ctx.lineTo(14*s,26*s);  ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(-5*s,10*s); ctx.lineTo(-6*s,28*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(5*s,10*s);  ctx.lineTo(6*s,28*s);  ctx.stroke();
    }
    // Boots
    ctx.fillStyle='#222';
    if(gk.divePhase>0.1){
      ctx.beginPath(); ctx.ellipse(-17*s,27*s,6*s,3*s,.3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(15*s,27*s,6*s,3*s,-.3,0,Math.PI*2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.ellipse(-6*s,29*s,6*s,3*s,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(6*s,29*s,6*s,3*s,0,0,Math.PI*2); ctx.fill();
    }

    // Jersey body
    const jg=ctx.createLinearGradient(-10*s,-6*s,10*s,12*s);
    jg.addColorStop(0,JC); jg.addColorStop(1,lighten(JC,-30));
    ctx.fillStyle=jg;
    ctx.beginPath(); ctx.roundRect(-10*s,-5*s,20*s,18*s,4*s); ctx.fill();

    // Arms
    ctx.strokeStyle=JC; ctx.lineWidth=5*s;
    if(gk.divePhase>0.45 && gk.diveDir!==0){
      const ax=gk.diveDir*36*s;
      ctx.beginPath(); ctx.moveTo(gk.diveDir*10*s,0); ctx.lineTo(ax,-6*s); ctx.stroke();
      ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(ax,-6*s,5*s,0,Math.PI*2); ctx.fill();
      // other arm
      ctx.beginPath(); ctx.moveTo(-gk.diveDir*10*s,2*s); ctx.lineTo(-gk.diveDir*16*s,12*s); ctx.stroke();
      ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(-gk.diveDir*16*s,13*s,4*s,0,Math.PI*2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(-10*s,0); ctx.lineTo(-16*s,12*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(10*s,0);  ctx.lineTo(16*s,12*s);  ctx.stroke();
      ctx.fillStyle='#ffd700';
      ctx.beginPath(); ctx.arc(-16*s,13*s,4*s,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(16*s,13*s,4*s,0,Math.PI*2);  ctx.fill();
    }

    // Head
    ctx.fillStyle='#f4a462';
    ctx.beginPath(); ctx.arc(0,-14*s,9*s,0,Math.PI*2); ctx.fill();
    // Cap
    ctx.fillStyle=gk.isCorrect?'#22c55e':JC;
    ctx.beginPath(); ctx.ellipse(0,-18*s,9*s,5*s,0,Math.PI,0); ctx.fill();
    // Eyes
    ctx.fillStyle='#111';
    ctx.beginPath(); ctx.arc(-3*s,-13*s,1.5*s,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(3*s,-13*s,1.5*s,0,Math.PI*2);  ctx.fill();

    ctx.restore();

    // Answer card
    drawAnswerCard(gk, i);
  });
}

function lighten(hex, amount){
  let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  r=Math.max(0,Math.min(255,r+amount));
  g=Math.max(0,Math.min(255,g+amount));
  b=Math.max(0,Math.min(255,b+amount));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function drawAnswerCard(gk, i){
  const cardW=Math.min(88*SCALE, W*.185);
  const cardH=30*SCALE;
  const cx=gk.x, cy=gk.y-52*SCALE;
  const COLORS=['#e74c3c','#3498db','#f39c12','#9b59b6'];
  const C=COLORS[i];

  // Correct glow after result
  if(state===ST.RESULT && gk.isCorrect){
    ctx.save();
    ctx.shadowColor='#22c55e'; ctx.shadowBlur=18;
    ctx.strokeStyle='#22c55e'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.roundRect(cx-cardW/2-5,cy-cardH/2-5,cardW+10,cardH+10,9*SCALE); ctx.stroke();
    ctx.restore();
  }

  // Card bg
  ctx.fillStyle='rgba(8,8,8,0.9)';
  ctx.beginPath(); ctx.roundRect(cx-cardW/2,cy-cardH/2,cardW,cardH,7*SCALE); ctx.fill();

  // Border
  ctx.strokeStyle=C; ctx.lineWidth=1.8*SCALE;
  ctx.beginPath(); ctx.roundRect(cx-cardW/2,cy-cardH/2,cardW,cardH,7*SCALE); ctx.stroke();

  // Letter tab
  ctx.fillStyle=C;
  ctx.beginPath(); ctx.roundRect(cx-cardW/2,cy-cardH/2,17*SCALE,cardH,{upperLeft:7*SCALE,lowerLeft:7*SCALE}); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold '+Math.round(9*SCALE)+'px Outfit';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(gk.label, cx-cardW/2+8.5*SCALE, cy);

  // Word
  ctx.fillStyle='#f0f0f0'; ctx.font=Math.round(8.5*SCALE)+'px Outfit';
  ctx.textAlign='left';
  const maxW=cardW-22*SCALE;
  let word=gk.option;
  while(ctx.measureText(word).width>maxW && word.length>2) word=word.slice(0,-1);
  if(word!==gk.option) word+='...';
  ctx.fillText(word, cx-cardW/2+20*SCALE, cy);
}

function drawKicker(){
  const kx=kicker.x, ky=kicker.y;
  const s=SCALE;
  ctx.save();

  // Shadow
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(kx,ky+22*s,18*s,6*s,0,0,Math.PI*2); ctx.fill();

  const bob = kicker.isRunning ? Math.sin(kicker.stepPhase)*3.5*s : 0;
  const kickLean = kicker.isKicking ? Math.sin(kicker.kickPhase*Math.PI)*.38 : 0;

  ctx.translate(kx, ky+bob);
  ctx.rotate(kickLean);

  // Legs
  ctx.strokeStyle='#1d3557'; ctx.lineWidth=6*s; ctx.lineCap='round';
  if(kicker.isKicking){
    const ka=kicker.kickPhase*Math.PI*.75;
    // standing leg
    ctx.beginPath(); ctx.moveTo(-4*s,14*s); ctx.lineTo(-5*s,28*s); ctx.stroke();
    // kicking leg
    ctx.save(); ctx.translate(5*s,14*s); ctx.rotate(-ka);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(2*s,15*s); ctx.stroke();
    ctx.restore();
    // boots
    ctx.fillStyle='#111';
    ctx.beginPath(); ctx.ellipse(-5*s,29*s,6*s,3*s,0,0,Math.PI*2); ctx.fill();
    const bx=5*s+Math.sin(ka)*15*s, by=14*s+Math.cos(ka)*15*s;
    ctx.beginPath(); ctx.ellipse(bx,by,6*s,3*s,-ka,0,Math.PI*2); ctx.fill();
  } else {
    const ls=kicker.isRunning?Math.sin(kicker.stepPhase)*11*s:0;
    ctx.beginPath(); ctx.moveTo(-4*s,14*s); ctx.lineTo(-4*s+ls,28*s);  ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4*s,14*s);  ctx.lineTo(4*s-ls,28*s);   ctx.stroke();
    ctx.fillStyle='#111';
    ctx.beginPath(); ctx.ellipse(-4*s+ls,29*s,6*s,3*s,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4*s-ls,29*s,6*s,3*s,0,0,Math.PI*2);  ctx.fill();
  }

  // Shorts
  ctx.fillStyle='#1d3557';
  ctx.beginPath(); ctx.roundRect(-10*s,4*s,20*s,10*s,3*s); ctx.fill();

  // Jersey
  const jg=ctx.createLinearGradient(-11*s,-18*s,11*s,5*s);
  jg.addColorStop(0,'#e63946'); jg.addColorStop(1,'#a01018');
  ctx.fillStyle=jg;
  ctx.beginPath(); ctx.roundRect(-10*s,-18*s,20*s,22*s,5*s); ctx.fill();

  // Arms
  ctx.strokeStyle='#e63946'; ctx.lineWidth=5*s; ctx.lineCap='round';
  const as=kicker.isRunning?Math.sin(kicker.stepPhase+Math.PI)*9*s:0;
  ctx.beginPath(); ctx.moveTo(-10*s,-8*s); ctx.lineTo(-15*s-as*.5,4*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10*s,-8*s);  ctx.lineTo(15*s+as*.5,4*s);  ctx.stroke();

  // Head
  ctx.fillStyle='#f4a462';
  ctx.beginPath(); ctx.arc(0,-26*s,10*s,0,Math.PI*2); ctx.fill();
  // Hair
  ctx.fillStyle='#3a1f00';
  ctx.beginPath(); ctx.ellipse(0,-32*s,10*s,5.5*s,0,Math.PI,0); ctx.fill();
  // Eyes
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(-3.5*s,-25*s,1.5*s,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(3.5*s,-25*s,1.5*s,0,Math.PI*2);  ctx.fill();

  ctx.restore();
}

function drawBallAtRest(){
  if(state===ST.AIMING || ballInFlight || state===ST.RESULT || state===ST.RUNNING) return;
  const t=Date.now()/400;
  const idy=Math.sin(t)*.8*SCALE;
  drawBallAt(ball.x, ball.y+idy, ball.r, 0);
}

function drawBall(){
  if(!ballInFlight && state!==ST.FLYING) return;
  // Shadow on ground
  const shadowY = kicker.y + (ballPath.ty-kicker.y)*ballT;
  ctx.save();
  ctx.globalAlpha=.22*(1-ballT*.5);
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(ball.x,shadowY+4*SCALE,ball.r*1.1,ball.r*.35,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // Ball glow
  ctx.save();
  ctx.globalAlpha=Math.sin(ballT*Math.PI)*.3;
  const grd=ctx.createRadialGradient(ball.x,ball.y,ball.r,ball.x,ball.y,ball.r*3.5);
  grd.addColorStop(0,'rgba(255,215,0,0.7)'); grd.addColorStop(1,'transparent');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r*3.5,0,Math.PI*2); ctx.fill();
  ctx.restore();

  drawBallAt(ball.x, ball.y, ball.r, ball.spin);
}

function drawBallAt(x,y,r,spin){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(spin);
  // Main body
  const bg=ctx.createRadialGradient(-r*.3,-r*.3,r*.05,0,0,r);
  bg.addColorStop(0,'#fff'); bg.addColorStop(.5,'#ebebeb'); bg.addColorStop(1,'#aaa');
  ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  // Patches
  ctx.fillStyle='#111';
  [[0,0],[r*.52,r*.28],[r*.52,-r*.28],[-r*.52,r*.28],[-r*.52,-r*.28],[0,r*.57],[0,-r*.57]].forEach(([px,py])=>{
    ctx.beginPath();
    for(let j=0;j<5;j++){const a=j*Math.PI*2/5-Math.PI/2;const pr=r*.22;j===0?ctx.moveTo(px+pr*Math.cos(a),py+pr*Math.sin(a)):ctx.lineTo(px+pr*Math.cos(a),py+pr*Math.sin(a));}
    ctx.closePath(); ctx.fill();
  });
  // Shine
  ctx.fillStyle='rgba(255,255,255,.42)';
  ctx.beginPath(); ctx.ellipse(-r*.28,-r*.28,r*.2,r*.13,-.5,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawTrajectory(){
  if(state!==ST.AIMING || !aimStart || !aimEnd) return;
  const dx=aimStart.x-aimEnd.x, dy=aimStart.y-aimEnd.y;
  const dist=Math.hypot(dx,dy);
  if(dist<8) return;
  const power=Math.min(dist/110,1);
  const len=Math.hypot(dx,dy), ndx=dx/len, ndy=dy/len;
  const tx=ball.x+ndx*W*.62;
  const ty=Math.min(ball.y+ndy*H*.62, H*.24);
  const cx=(ball.x+tx)/2;
  const cy=Math.min(ball.y,ty)-H*(0.15+power*.1)-30*SCALE;

  // Aim cone on pitch
  ctx.save();
  ctx.globalAlpha=.09;
  ctx.fillStyle='#22c55e';
  const ang=Math.atan2(ndy,ndx);
  ctx.beginPath();
  ctx.moveTo(ball.x,ball.y);
  ctx.lineTo(ball.x+Math.cos(ang-.22)*200*SCALE, ball.y+Math.sin(ang-.22)*200*SCALE);
  ctx.lineTo(ball.x+Math.cos(ang+.22)*200*SCALE, ball.y+Math.sin(ang+.22)*200*SCALE);
  ctx.closePath(); ctx.fill();

  // Dotted arc trajectory (60%)
  ctx.globalAlpha=1;
  const DOTS=20, MAXT=0.6;
  for(let i=0;i<=DOTS;i++){
    const t=(i/DOTS)*MAXT, mt=1-t;
    const bx=mt*mt*ball.x+2*mt*t*cx+t*t*tx;
    const by=mt*mt*ball.y+2*mt*t*cy+t*t*ty;
    const ds=(5.5-2.5*t)*SCALE;
    ctx.globalAlpha=.95-t*.5;
    // Gradient color along arc
    const hue=Math.floor(45-t*30);
    ctx.fillStyle='hsl('+hue+',100%,60%)';
    ctx.beginPath(); ctx.arc(bx,by,ds,0,Math.PI*2); ctx.fill();
  }

  // Direction guide line
  ctx.globalAlpha=.3;
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=1.2*SCALE; ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.moveTo(ball.x,ball.y); ctx.lineTo(aimEnd.x,aimEnd.y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // Power bar
  const bw=90*SCALE, bh=7*SCALE;
  const bx2=ball.x-bw/2, by2=ball.y+22*SCALE;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.55)';
  ctx.beginPath(); ctx.roundRect(bx2,by2,bw,bh,3*SCALE); ctx.fill();
  const pc=power<.4?'#22c55e':power<.7?'#ffd700':'#ef4444';
  ctx.fillStyle=pc;
  ctx.beginPath(); ctx.roundRect(bx2,by2,bw*power,bh,3*SCALE); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font=Math.round(7*SCALE)+'px Outfit';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText('POWER',ball.x,by2-1*SCALE);
  ctx.restore();
}

function drawEnvironment(){
  // Crowd silhouettes
  ctx.save(); ctx.globalAlpha=.13;
  for(let i=0;i<44;i++){
    const ex=i*(W/42), ey=H*.01+Math.sin(i*.7)*H*.012;
    ctx.fillStyle=i%3===0?'#2a5a2a':i%3===1?'#1a3a1a':'#334433';
    ctx.beginPath(); ctx.arc(ex,ey+3*SCALE,4*SCALE,Math.PI,0);
    ctx.fillRect(ex-3*SCALE,ey+3*SCALE,6*SCALE,9*SCALE);
  }
  ctx.restore();
  // Lens flare / spotlights
  [[W*.03,H*.04],[W*.97,H*.04]].forEach(([lx,ly])=>{
    const g=ctx.createRadialGradient(lx,ly,0,lx,ly,55*SCALE);
    g.addColorStop(0,'rgba(255,250,200,.14)'); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(lx,ly,55*SCALE,0,Math.PI*2); ctx.fill();
  });
}

function drawGoalFlash(){
  if(goalFlash<=0) return;
  ctx.save();
  ctx.globalAlpha=goalFlash*.35;
  const gf=ctx.createRadialGradient(W*.5,H*.2,0,W*.5,H*.2,W*.6);
  gf.addColorStop(0,'rgba(255,220,0,1)'); gf.addColorStop(1,'transparent');
  ctx.fillStyle=gf; ctx.fillRect(0,0,W,H);
  ctx.restore();
}

// ─── GAME LOOP ─────────────────────────────────────────────────────
let lastTime=0;
function gameLoop(ts){
  if(menuScreen.style.display!=='none' || gameOverScreen.style.display==='flex') return;
  const dt=Math.min(ts-lastTime,50); lastTime=ts;

  // Shake
  if(screenShake.timer>0){
    screenShake.timer=Math.max(0,screenShake.timer-dt);
    const m=screenShake.mag*(screenShake.timer/420);
    screenShake.x=(Math.random()-.5)*m*2;
    screenShake.y=(Math.random()-.5)*m*2;
  } else { screenShake.x=0; screenShake.y=0; }

  // Run-up
  if(state===ST.RUNNING && kicker.isRunning){
    runStepTimer+=dt;
    kicker.stepPhase+=dt*.013;
    if(runStepTimer>125){
      runStepTimer=0; runStepCount++;
      if(runStepCount%2===0) playFootstep();
      kicker.y-=2.8*SCALE;
      kicker.x+=(ballPath.tx-kicker.x)*.045;
      if(runStepCount>=MAX_STEPS){
        kicker.isRunning=false; kicker.isKicking=true; kicker.kickPhase=0;
        reactGoalkeepers();
        playKick();
        setTimeout(()=>{ ballInFlight=true; flightFrame=0; state=ST.FLYING; },170);
      }
    }
  }

  // Kick pose
  if(kicker.isKicking && !ballInFlight){
    kicker.kickPhase=Math.min(kicker.kickPhase+dt*.009,1);
    if(kicker.kickPhase>=1){ kicker.isKicking=false; kicker.done=true; }
  }

  // Ball flight
  if(state===ST.FLYING && ballInFlight) updateFlight();

  // Goal flash
  if(goalFlash>0) goalFlash=Math.max(0,goalFlash-dt*.003);

  // Idle ball bob time
  if(state===ST.IDLE) idleTime+=dt;

  updateParticles();

  // Draw
  ctx.save();
  ctx.translate(screenShake.x, screenShake.y);
  drawPitch();
  drawEnvironment();
  drawGoal();
  drawTrajectory();
  drawGoalkeepers();
  drawBallAtRest();
  drawBall();
  drawKicker();
  drawGoalFlash();
  ctx.restore();
  drawParticles();

  requestAnimationFrame(gameLoop);
}

// ─── INIT ──────────────────────────────────────────────────────────
loadData();

})();
</script>
