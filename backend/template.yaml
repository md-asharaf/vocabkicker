AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: VocabKicker Serverless Backend with Spring Cloud Function

Parameters:
  JwtSecret:
    Type: String
    Description: "Secret key for JWT generation (must be at least 32 characters)"
    NoEcho: true
  CorsAllowOrigin:
    Type: String
    Description: "Allowed origin for CORS (e.g. http://localhost:8000)"
    Default: "http://localhost:8000"
  ImportBucketName:
    Type: String
    Description: "Specific name for the S3 bucket to import files (must be globally unique)"
    Default: "vocabkicker-import-bucket"

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,Cookie'"
      AllowOrigin: !Sub "'${CorsAllowOrigin}'"
      AllowCredentials: true
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: java17
    Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
    CodeUri: target/serverless-0.0.1-SNAPSHOT-aws.jar
    Environment:
      Variables:
        JWT_SECRET: !Ref JwtSecret
        MAIN_CLASS: com.vocabkicker.serverless.VocabKickerServerlessApplication
        CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
        IMPORT_BUCKET_NAME: !Ref ImportBucketName

Resources:
  QuestionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Questions
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Users
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  QuestionsImportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ImportBucketName
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
              - GET
            AllowedOrigins:
              - !Ref CorsAllowOrigin
              - "http://localhost:3000"
            MaxAge: 3000

  AdminLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: adminLogin
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /admin/login
            Method: post

  CreateAdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: createAdmin
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /admin/register
            Method: post

  AdminRefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: adminRefresh
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /admin/refresh
            Method: post

  ListAdminsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: listAdmins
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /admins
            Method: get

  UpdateAdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: updateAdmin
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /admins/{id}
            Method: put

  DeleteAdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: deleteAdmin
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /admins/{id}
            Method: delete

  GetQuestionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: getQuestions
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref QuestionsTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /questions
            Method: get

  GenerateQuizFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: generateQuiz
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref QuestionsTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /quiz/generate
            Method: get

  GetQuestionByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: getQuestionById
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref QuestionsTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /questions/{id}
            Method: get

  GenerateUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: generateUploadUrl
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImportBucketName
      Events:
        Api:
          Type: Api
          Properties:
            Path: /questions/upload-url
            Method: get

  BatchCreateQuestionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: batchCreateQuestions
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ImportBucketName
        - DynamoDBCrudPolicy:
            TableName: !Ref QuestionsTable
      Events:
        FileUpload:
          Type: S3
          Properties:
            Bucket: !Ref QuestionsImportBucket
            Events: s3:ObjectCreated:*

  UpdateQuestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: updateQuestion
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QuestionsTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /questions/{id}
            Method: put

  DeleteQuestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: deleteQuestion
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QuestionsTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /questions/{id}
            Method: delete

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
